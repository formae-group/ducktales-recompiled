# NESRecomp cycle-backend configuration for DuckTales (USA).
# Every entry below must be backed by evidence recorded in docs/.

[game]
output_prefix = "ducktales"
cycle_accurate = true
console = "nes"
cycle_seed_file = "ducktales.seeds"

# Entry of the main task. Reset stores $D4E6 in $93/$94 and calls the task
# creator at $FF7D; the scheduler at $FF35 starts it through JMP ($0093), which
# static discovery cannot follow. See docs/functions.md.
[[extra_func]]
bank = 7
addr = 0xD4E6

# Event sites (src/game/events.c, docs/decompilation.md "Events"). Each
# fires only while its event has a handler (an enhancement that differs from
# the original game, or a mod); the content keys are CRC32s of the 8 bytes at
# each site. They come before the decompilation's sites, so at an address
# both use ($EB5E) the event runs first.

# Entry of the damage routine; a cancel returns from it.
[[mod_function_hook]]
id = "ducktales.event.player-damaged"
addr = 0xEB5E
length = 8
crc32 = 0xE8776DC5

# The timer's decrement of the frames-per-tick counter $B0.
[[mod_function_hook]]
id = "ducktales.event.timer-tick"
addr = 0xE2A6
length = 8
crc32 = 0x1FF60228

# The only decrement of the lives counter $0361.
[[mod_function_hook]]
id = "ducktales.event.life-lost"
addr = 0xDCB0
length = 8
crc32 = 0x5E982A4B

# After the title set-up copied the HUD template that sets $0361 to 2.
[[mod_function_hook]]
id = "ducktales.event.new-game"
addr = 0xD59C
length = 8
crc32 = 0xB92CE193

# The instruction that follows the jump start's two velocity stores.
[[mod_function_hook]]
id = "ducktales.event.jump-start"
addr = 0xE3FE
length = 8
crc32 = 0xC37F991F

# The decrement of the boss hits left $B1, reached only for a hit that counts.
[[mod_function_hook]]
id = "ducktales.event.boss-hit"
addr = 0xF6DD
length = 8
crc32 = 0xA509A34C

